# Snippet para media.lwksistemas.com.br (201.23.87.251).
# Incluir no server SSL ANTES de location /.
# GET /files/ continua servido do disco; Flask só valida a assinatura (auth_request).
#
# MEDIA_REQUIRE_SIGNED=0 (padrão): links antigos sem ?e=&s= continuam válidos.
# MEDIA_REQUIRE_SIGNED=1: exige HMAC (após assinar todas as URLs expostas).

location /files/ {
    auth_request /auth-file;
    alias /storage/;
    expires 7d;
    add_header Cache-Control "private, max-age=604800";
}

location = /auth-file {
    internal;
    proxy_pass http://127.0.0.1:9000/auth-file;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
}
