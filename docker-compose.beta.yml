# Stack isolada do servidor beta (201.54.18.213).
# Banco vazio / loja de teste — NUNCA dump de produção (clientes reais).
# Uso no host: docker compose -f docker-compose.beta.yml up -d --build
#
# VM mínima confortável: 4 vCPU / 8 GB. Em 4 GB os limites abaixo evitam OOM;
# WhatsApp + PACS funcionam para teste funcional, não para carga.

services:
  postgres:
    image: postgres:18.6-bookworm
    restart: always
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
    volumes:
      - pgdata_beta:/var/lib/postgresql
    environment:
      POSTGRES_DB: lwk_beta
      POSTGRES_USER: lwk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lwk"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"
    mem_limit: 384m

  redis:
    image: redis:7.4-alpine
    restart: always
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:6379:6379"
    mem_limit: 160m

  backend:
    build:
      context: .
      dockerfile: Dockerfile.magalu
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - DATABASE_URL=postgres://lwk:${POSTGRES_PASSWORD}@postgres:5432/lwk_beta
      - REDIS_URL=redis://redis:6379/0
      - LWK_PROCESS_ROLE=web
      - LWK_ENVIRONMENT=staging
      - DJANGO_Q_WORKERS=1
      - CONN_MAX_AGE=60
    command:
      - gunicorn
      - config.wsgi
      - --bind
      - 0.0.0.0:8080
      - --workers
      - "2"
      - --threads
      - "2"
      - --worker-class
      - gthread
      - --timeout
      - "60"
      - --graceful-timeout
      - "30"
      - --keep-alive
      - "5"
      - --max-requests
      - "1000"
      - --max-requests-jitter
      - "50"
      - --log-file
      - "-"
      - --access-logfile
      - "-"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /etc/lwk-encryption.key:/etc/lwk-encryption.key:ro
      - orthanc-worklists:/var/lib/orthanc/worklists
    mem_limit: 768m

  worker:
    build:
      context: .
      dockerfile: Dockerfile.magalu
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - DATABASE_URL=postgres://lwk:${POSTGRES_PASSWORD}@postgres:5432/lwk_beta
      - REDIS_URL=redis://redis:6379/0
      - LWK_PROCESS_ROLE=worker
      - LWK_ENVIRONMENT=staging
      - DJANGO_Q_WORKERS=1
    command: sh scripts/start_worker.sh
    volumes:
      - /etc/lwk-encryption.key:/etc/lwk-encryption.key:ro
      - orthanc-worklists:/var/lib/orthanc/worklists
    mem_limit: 512m

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - NEXT_PUBLIC_API_URL=https://beta.lwksistemas.com.br
    restart: always
    env_file: .env.frontend
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 256m

  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: always
    environment:
      - SERVER_URL=https://beta.lwksistemas.com.br
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgres://lwk:${POSTGRES_PASSWORD}@postgres:5432/evolution
      - DATABASE_CONNECTION_CLIENT_NAME=evolution
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/1
      - LOG_LEVEL=WARN
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - evolution_instances:/evolution/instances
    mem_limit: 768m

  orthanc:
    image: orthancteam/orthanc:26.6.1
    container_name: lwk-beta-orthanc
    restart: unless-stopped
    ports:
      - "4242:4242"
      - "127.0.0.1:8042:8042"
    volumes:
      - ./radiologia/orthanc/orthanc.runtime.json:/etc/orthanc/orthanc.json:ro
      - orthanc-db:/var/lib/orthanc/db
      - orthanc-storage:/var/lib/orthanc/storage
      - orthanc-worklists:/var/lib/orthanc/worklists
    environment:
      VERBOSE_STARTUP: "true"
    mem_limit: 512m

  media:
    build:
      context: ./media-server
      dockerfile: Dockerfile
    restart: always
    environment:
      - MEDIA_API_TOKEN=${MEDIA_API_TOKEN}
    volumes:
      - /var/lib/lwk-beta-media:/storage
    ports:
      - "127.0.0.1:9000:9000"
    mem_limit: 128m

volumes:
  pgdata_beta:
  evolution_instances:
  orthanc-db:
  orthanc-storage:
  orthanc-worklists:
