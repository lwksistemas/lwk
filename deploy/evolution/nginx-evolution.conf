# Nginx — evolution.lwksistemas.com.br (VM dedicada Evolution)
# Instalar em: /etc/nginx/sites-available/evolution  (symlink em sites-enabled)
#
# O bloco TLS (ssl_certificate) é preenchido automaticamente pelo Certbot ao rodar:
#   sudo certbot --nginx -d evolution.lwksistemas.com.br
# Deixe este arquivo com o server :80 e o location; o Certbot adiciona o :443.

server {
    listen 80;
    server_name evolution.lwksistemas.com.br;

    # Desafio ACME (Certbot) e redirect para HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name evolution.lwksistemas.com.br;

    # Preenchido pelo Certbot:
    # ssl_certificate     /etc/letsencrypt/live/evolution.lwksistemas.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/evolution.lwksistemas.com.br/privkey.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # WebSocket (Baileys mantém conexão persistente com o WhatsApp).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        # Timeouts generosos para conexões longas de WebSocket.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
