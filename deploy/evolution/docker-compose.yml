# Evolution API — WhatsApp Web (VM dedicada Magalu BV2-4-100: 2 vCPU / 4 GB / 100 GB)
#
# Serviço separado do servidor principal LWK (wksistemas / 201.23.81.50).
# Postgres e Redis próprios nesta VM — isolamento total do ERP.
#
# Subir:   docker compose up -d
# Logs:    docker compose logs -f evolution
# Versão:  use evoapicloud/evolution-api v2.3.7+ (atendai v2.2.3 quebra o /connect)

services:
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution-api
    restart: always
    environment:
      - SERVER_URL=https://evolution.lwksistemas.com.br
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgres://evolution:${PG_PASS}@postgres:5432/evolution
      - DATABASE_CONNECTION_CLIENT_NAME=evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=false
      - DATABASE_SAVE_MESSAGE_UPDATE=false
      - DATABASE_SAVE_DATA_CONTACTS=false
      - DATABASE_SAVE_DATA_CHATS=false
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/1
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_LOCAL_ENABLED=false
      - QRCODE_LIMIT=30
      - LOG_LEVEL=WARN
      - LOG_BAILEYS=error
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Exposto só no loopback — o nginx no host faz o TLS e o proxy público.
      - "127.0.0.1:8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
    # Folga confortável na BV2-4-100 (4 GB). Deixa ~1,2 GB para Postgres+Redis+SO.
    mem_limit: 2800m

  postgres:
    image: postgres:18.6-bookworm
    container_name: evolution-postgres
    restart: always
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=50
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${PG_PASS}
    volumes:
      # PG18+ exige o mount na raiz (/var/lib/postgresql), não em /data.
      - evolution_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7.4-alpine
    container_name: evolution-redis
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - evolution_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  evolution_pg:
  evolution_redis:
  evolution_instances:
