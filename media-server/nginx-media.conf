# Snippet para media.lwksistemas.com.br (201.23.87.251).
# Incluir no server SSL ANTES de location /.
# GET /files/ continua servido do disco; Flask só valida a assinatura (auth_request).
#
# MEDIA_REQUIRE_SIGNED=1 (padrão): exige HMAC. A API assina por 2 horas.
# =0 só se a API ainda não estiver assinando.

location /archive/ {
    proxy_pass http://127.0.0.1:9000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /files/ {
    auth_request /auth-file;
    alias /storage/;
    expires 7d;
    add_header Cache-Control "private, max-age=604800";
}

location = /auth-file {
    internal;
    proxy_pass http://127.0.0.1:9000/auth-file;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
}
