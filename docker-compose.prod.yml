services:
  postgres:
    image: postgres:18.6-bookworm
    restart: always
    # Tuning para BV8-16-150 (8 vCPU / 16 GB), compartilhado com app/Evolution.
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=10GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=150
      - -c
      - wal_buffers=64MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - default_statistics_target=100
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_DB: lwk
      POSTGRES_USER: lwk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lwk"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7.4-alpine
    restart: always
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.magalu
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - DATABASE_URL=postgres://lwk:${POSTGRES_PASSWORD}@postgres:5432/lwk
      - REDIS_URL=redis://redis:6379/0
      - LWK_PROCESS_ROLE=web
      - CONN_MAX_AGE=120
      - TENANT_CONN_MAX_AGE=0
      - DJANGO_Q_WORKERS=4
    # Override do Dockerfile: 6×2=12 slots (antes 4×2=8) no host 8 vCPU.
    command:
      - gunicorn
      - config.wsgi
      - --bind
      - 0.0.0.0:8080
      - --workers
      - "6"
      - --threads
      - "2"
      - --worker-class
      - gthread
      - --timeout
      - "60"
      - --graceful-timeout
      - "30"
      - --keep-alive
      - "5"
      - --max-requests
      - "1000"
      - --max-requests-jitter
      - "50"
      - --log-file
      - "-"
      - --access-logfile
      - "-"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - media:/app/media
      - /etc/lwk-encryption.key:/etc/lwk-encryption.key:ro
      - staticfiles:/app/staticfiles

  worker:
    build:
      context: .
      dockerfile: Dockerfile.magalu
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - DATABASE_URL=postgres://lwk:${POSTGRES_PASSWORD}@postgres:5432/lwk
      - REDIS_URL=redis://redis:6379/0
      - LWK_PROCESS_ROLE=worker
      - DJANGO_Q_WORKERS=4
      - TENANT_CONN_MAX_AGE=0
    command: sh scripts/start_worker.sh
    volumes:
      - media:/app/media
      - /etc/lwk-encryption.key:/etc/lwk-encryption.key:ro

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: always
    env_file: .env.frontend
    ports:
      - "127.0.0.1:3000:3000"

  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: always
    environment:
      - SERVER_URL=https://evolution.lwksistemas.com.br
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgres://lwk:${POSTGRES_PASSWORD}@postgres:5432/evolution
      - DATABASE_CONNECTION_CLIENT_NAME=evolution
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/1
      - LOG_LEVEL=WARN
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"

  frontend-beta:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - NEXT_PUBLIC_API_URL=https://api.lwksistemas.com.br
    restart: always
    env_file: .env.frontend
    environment:
      - LWK_BRANCH=staging
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  pgdata:
  redisdata:
  media:
  staticfiles: